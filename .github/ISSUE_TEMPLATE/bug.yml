name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing this. Please include enough detail that the bug
        can be reproduced without follow-up.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the bug.
      placeholder: e.g. Pocket world opens twice in a row when scrolling slowly past a category ring.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Exact steps to reproduce.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + OS + viewport size (and prod URL or local).
      placeholder: Chrome 132 macOS, 1440×960, https://ai-tool-universe-map.vercel.app
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Optional but very helpful for visual bugs.
