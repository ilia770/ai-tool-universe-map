name: iOS

# Path-filtered so web-only PRs don't spin up a macOS runner. Runs the
# generic-simulator build + build-for-testing (compiles app + test
# targets without booting a simulator), via the shared verify script —
# backlog task 34. A booted-simulator test pass stays a local gate
# (CoreSimulator boots are flaky on CI); this proves the Swift compiles
# and the test target links on every iOS-touching PR.

on:
  pull_request:
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  verify:
    name: iOS verify (xcodegen • build • build-for-testing)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The app uses iOS 26 Liquid Glass APIs (.glassEffect / Glass.regular),
      # so it must build with Xcode 26+. The runner's default (16.4) ships an
      # iOS 18 SDK that lacks those symbols. Select the newest stable Xcode on
      # the image; its SDK and simulator runtime match (avoids the actool
      # "no simulator runtime" failure that pinning an arbitrary Xcode_X caused).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build + build-for-testing
        run: bash scripts/ios-verify.sh --test-build-only
