name: iOS

# Path-filtered so web-only PRs don't spin up a macOS runner. Two jobs:
#   verify    — fast compile gate: generic-simulator build + build-for-testing
#               (compiles app + test targets without booting a simulator).
#   unit-test — boots a simulator and runs the MyAIMapTests bundle so CI
#               actually executes assertions (review ticket R3). Kept separate
#               from the fast gate because CoreSimulator boots are slower/flakier.

on:
  pull_request:
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  verify:
    name: iOS verify (xcodegen • build • build-for-testing)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The app uses iOS 26 Liquid Glass APIs (.glassEffect / Glass.regular),
      # so it must build with Xcode 26+. The runner's default (16.4) ships an
      # iOS 18 SDK that lacks those symbols. Select the newest stable Xcode on
      # the image; its SDK and simulator runtime match (avoids the actool
      # "no simulator runtime" failure that pinning an arbitrary Xcode_X caused).
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build + build-for-testing
        run: bash scripts/ios-verify.sh --test-build-only

  unit-test:
    name: iOS unit tests (MyAIMapTests on simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      # Boot the newest available iPhone simulator and pass its UDID to the
      # shared script's --run-tests mode, which runs `xcodebuild test
      # -only-testing:MyAIMapTests` and writes an xcresult bundle. This is the
      # step that actually executes assertions (review ticket R3).
      - name: Boot simulator and run unit tests
        run: |
          SIM_ID="$(xcrun simctl list devices available \
            | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F-]+' \
            | tail -n 1)"
          if [ -z "$SIM_ID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator $SIM_ID"
          bash scripts/ios-verify.sh --run-tests --device-id "$SIM_ID"

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyAIMapTests-xcresult
          path: ios-app/build/MyAIMapTests.xcresult
          if-no-files-found: ignore
