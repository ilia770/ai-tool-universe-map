name: iOS

# Path-filtered so web-only PRs don't spin up a macOS 26 runner. Two jobs:
#   verify    — fast compile gate: generic-simulator build + build-for-testing
#               (compiles app + test targets without booting a simulator).
#   unit-test — boots a simulator and runs the MyAIMapTests bundle so CI
#               actually executes assertions (review ticket R3).
#   ui-smoke  — runs the XCUITest flow that taps key UI states and keeps
#               screenshots in the xcresult bundle for visual review. Simulator
#               jobs stay separate because CoreSimulator boots are slower/flakier.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, work]
    paths:
      - 'ios-app/**'
      - 'scripts/ios-verify.sh'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: iOS verify (xcodegen • build • build-for-testing)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The app uses iOS 26 Liquid Glass APIs (.glassEffect / Glass.regular),
      # so it must build with Xcode 26+. Select the newest stable Xcode on the
      # macOS 26 image so the SDK and simulator runtime stay matched.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build + build-for-testing
        run: bash scripts/ios-verify.sh --test-build-only

  unit-test:
    name: iOS unit tests (MyAIMapTests on simulator)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      # Boot the newest available iPhone simulator and pass its UDID to the
      # shared script's --run-tests mode, which runs `xcodebuild test
      # -only-testing:MyAIMapTests` and writes an xcresult bundle. This is the
      # step that actually executes assertions (review ticket R3).
      - name: Boot simulator and run unit tests
        run: |
          SIM_ID="$(xcrun simctl list devices available \
            | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F-]+' \
            | tail -n 1)"
          if [ -z "$SIM_ID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator $SIM_ID"
          bash scripts/ios-verify.sh --run-tests --device-id "$SIM_ID"

      - name: Print xcresult summary
        if: always()
        run: |
          SUMMARY_PATH="ios-app/build/MyAIMapTests-summary.json"
          if [ ! -d "ios-app/build/MyAIMapTests.xcresult" ]; then
            echo "No xcresult bundle found."
            exit 0
          fi

          xcrun xcresulttool get test-results summary \
            --path ios-app/build/MyAIMapTests.xcresult \
            | tee "$SUMMARY_PATH"
          grep -E '"(passedTests|failedTests|result)"' "$SUMMARY_PATH" || true

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MyAIMapTests-xcresult
          path: |
            ios-app/build/MyAIMapTests.xcresult
            ios-app/build/MyAIMapTests-summary.json
          if-no-files-found: ignore

  ui-smoke-test:
    name: iOS UI smoke (XCUITest screenshots)
    needs: unit-test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios-app
        run: xcodegen generate

      # Runs UniverseUISmokeTests/testCaptureKeyStates. The test launches with
      # -uitestStatic -uitestSampleUniverse, taps map/chat/detail/settings/
      # attachment states, and stores kept screenshots/text trees in xcresult.
      - name: Boot simulator and run UI smoke
        run: |
          SIM_ID="$(xcrun simctl list devices available \
            | grep -Eo 'iPhone[^(]*\(([0-9A-F-]+)\)' \
            | grep -Eo '[0-9A-F]{8}-[0-9A-F-]+' \
            | tail -n 1)"
          if [ -z "$SIM_ID" ]; then echo "No iPhone simulator available" >&2; exit 1; fi
          echo "Using simulator $SIM_ID"
          bash scripts/ios-verify.sh --run-ui-tests --device-id "$SIM_ID"

      - name: Print UI smoke xcresult summary
        if: always()
        run: |
          SUMMARY_PATH="ios-app/build/MyAIMapUITests-summary.json"
          if [ ! -d "ios-app/build/MyAIMapUITests.xcresult" ]; then
            echo "No UI smoke xcresult bundle found."
            exit 0
          fi

          xcrun xcresulttool get test-results summary \
            --path ios-app/build/MyAIMapUITests.xcresult \
            | tee "$SUMMARY_PATH"
          grep -E '"(passedTests|failedTests|result)"' "$SUMMARY_PATH" || true

      - name: Upload UI smoke xcresult bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MyAIMapUITests-xcresult
          path: |
            ios-app/build/MyAIMapUITests.xcresult
            ios-app/build/MyAIMapUITests-summary.json
          if-no-files-found: ignore
